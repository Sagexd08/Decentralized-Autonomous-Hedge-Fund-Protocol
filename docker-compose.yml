# IRIS Protocol — local development stack
#
# Phase 1 gate (IRIS_BUILD_PROMPT v2.0 section 27):
#   docker compose up  ->  web, api and db all answer a health check with 200.
#
#   web  http://localhost:3000/health
#   api  http://localhost:8000/health  and  /health/db
#   db   pg_isready
#
# Verify all three with `make verify`.

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # Server components render inside this container, where `localhost` is
      # the web container itself. NEXT_PUBLIC_API_URL is the browser's view of
      # the API; this is the server's. They are genuinely different addresses
      # for the same service and conflating them makes every server-side fetch
      # fail in a way that only shows up in production rendering.
      INTERNAL_API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      # Live-mount the source, exactly as the api service does. Without this a
      # new page needs a full image rebuild to appear at all, which is how
      # three finished routes came back 404.
      #
      # node_modules and .next stay as anonymous volumes so the mount does not
      # shadow what the image installed — the host has no node_modules (see
      # STATE.md, Known blockers 2) and mounting over it would empty them.
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: `next dev --hostname 0.0.0.0` binds IPv4
      # only, and wget resolves localhost to ::1 first — the container reported
      # unhealthy for hours while serving 200s to the host.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://iris:iris@db:5432/iris
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
    volumes:
      # Live-mount the source the image also bakes in, so an edit is a restart
      # rather than a rebuild. The image stays self-contained for deployment.
      - ./apps/api:/app
      - ./agents:/app/agents
      - ./ml:/app/ml
      # The §4 tree lives at the repo root, but /app is apps/api. Mounting the
      # root-level suites under /repo keeps both importable without one
      # shadowing the other, and lets the phase gates run inside the container
      # where psycopg and torch actually are.
      - ./tests:/repo/tests
      - ./scripts:/repo/scripts
      - ./db:/repo/db
      # Read-only, and only so the phase gates can inspect the web source they
      # verify. The Phase 13 gate asserts that the provenance notice renders
      # "unconfirmed" rather than "live" when the API cannot be reached — a
      # state that by definition cannot be observed in served HTML on a healthy
      # stack, so it is checked against the component itself.
      - ./apps/web:/repo/apps/web:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # gate on the database round trip, not just on the process being up
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/health/db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    # pgvector rather than stock postgres: the historical-memory layer
    # (v2 section 12) needs the vector type at schema-creation time.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
    volumes:
      - pgdata:/var/lib/postgresql/data
      # applied in lexical order on first boot only
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seed/0001_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
