# IRIS Protocol — local development stack
#
# Phase 1 gate (IRIS_BUILD_PROMPT v2.0 section 27):
#   docker compose up  ->  web, api and db all answer a health check with 200.
#
#   web  http://localhost:3000/health
#   api  http://localhost:8000/health  and  /health/db
#   db   pg_isready
#
# Verify all three with `make verify`.

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://iris:iris@db:5432/iris
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # gate on the database round trip, not just on the process being up
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/health/db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    # pgvector rather than stock postgres: the historical-memory layer
    # (v2 section 12) needs the vector type at schema-creation time.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
    volumes:
      - pgdata:/var/lib/postgresql/data
      # applied in lexical order on first boot only
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seed/0001_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
