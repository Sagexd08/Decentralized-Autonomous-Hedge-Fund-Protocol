[package]
name = "agent_registry"
version = "0.1.0"
description = "Solana Agent Registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-token = "7"
spl-associated-token-account = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
