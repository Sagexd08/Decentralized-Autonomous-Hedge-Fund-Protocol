[package]
name = "capital_vault"
version = "0.1.0"
description = "Solana Capital Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "capital_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[dev-dependencies]
# solana-program-test runs the program natively via processor!(), so the
# security tests need neither a local validator nor the SBF toolchain.
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-token = "7"
spl-associated-token-account = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
