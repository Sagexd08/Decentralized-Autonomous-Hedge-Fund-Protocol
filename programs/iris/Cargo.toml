[workspace]
members = ["programs/*"]
resolver = "2"

# Overflow checks stay on in release. This is financial infrastructure; a
# silent wraparound in a stake or weight calculation is a exploit, not a
# rounding error (v2 section 16).
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
