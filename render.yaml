# Production deployment for the protocol's server side — free tier.
#
# The web app is on Vercel; Postgres is Neon. What is left is the API, and this
# file is shaped by three facts about Render's free plan rather than by
# preference:
#
#   1. A free instance has 512MB. The full API image idles at 652MiB with torch
#      imported, so it cannot fit. It does not have to: the API answers
#      questions about what the protocol did, and every one of those answers is
#      a database read. `docker/api.slim.Dockerfile` drops torch, scipy and
#      scikit-learn — verified rather than hoped, since every router and
#      service imports clean of torch, and `/api/market/training` reads the
#      snapshot through `ml.training.dataset`, which imports only numpy.
#
#   2. A free service is suspended after fifteen minutes without inbound
#      traffic and takes about a minute to wake. So the in-process market
#      poller is switched off here (`IRIS_FEED_ENABLED=false`). A poller that
#      runs only while somebody is looking is not a feed — it produces a tape
#      with holes shaped like the traffic pattern. Ingest happens in the
#      scheduled cycle instead, whose window is computed from the oldest
#      prediction still awaiting evidence and therefore covers those gaps.
#
#   3. **Free cron jobs do not exist on Render.** The protocol cycle — ingest,
#      run every agent, settle, score, sweep risk, allocate — therefore runs in
#      GitHub Actions: `.github/workflows/cycle.yml`, free on a public
#      repository. Read the caveat about scheduling punctuality at the top of
#      that file; it is real, and it is survivable for the reasons stated.
#
# The thing to be honest about: a free deployment is a *dashboard over a
# protocol that runs elsewhere*. That is not a lesser version of the paid
# setup, it is a different split of the same work. To move the cycle back here,
# add a `type: cron` service on a paid plan, switch this to the full
# `docker/api.Dockerfile` on `plan: standard`, and set IRIS_FEED_ENABLED=true.
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repository.
# Nothing here carries a secret; every credential is `sync: false` and entered
# in the dashboard, per section 0's no-keys-in-source rule.

services:
  - type: web
    name: iris-api
    runtime: docker
    # The slim image. `docker/api.Dockerfile` is the full one, and is what the
    # GitHub Actions cycle installs the equivalent of.
    dockerfilePath: ./docker/api.slim.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Neon's **pooled** connection string, entered in the dashboard. Use the
      # direct one (drop `-pooler`) for migrations — PgBouncer's transaction
      # mode cannot run the DDL in db/migrations reliably.
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: /app
      # Off, deliberately: see (2) above. The scheduled cycle ingests.
      - key: IRIS_FEED_ENABLED
        value: "false"
      - key: IRIS_FEED_ASSETS
        value: BTC,ETH,SOL
      # No persistent disk on free, so nothing survives a restart. The slim
      # image fits no models anyway; this only keeps the path valid.
      - key: IRIS_MODEL_DIR
        value: /tmp/iris-models
      # Read-only chain access for the dashboard. Absent, the Solana client
      # degrades to a labelled simulation path rather than failing the boot.
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_AGENT_REGISTRY
        value: 6NTKNCtBnNAJjGfgFRNTPhbxBYz1GXv3mQRRdwdC2cNy
      - key: SOLANA_CAPITAL_VAULT
        value: HYxAvbCGmv7axJfQbbSxQXLyNiAhPQUyAsEo6nVUW1Gj
      - key: GROQ_API_KEY
        sync: false
